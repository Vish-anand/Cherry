<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --accent-pink: #ff4a5a;
            --accent-pink-glow: rgba(255, 74, 90, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Abstract glowing background circles */
        .ambient-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 74, 90, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            left: -150px;
            z-index: 0;
            pointer-events: none;
        }

        .login-card {
            background: rgba(25, 25, 30, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 74, 90, 0.03);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-sizing: border-box;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-cherry {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px rgba(255, 74, 90, 0.3));
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 74, 90, 0.3)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(255, 74, 90, 0.6)); }
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            color: #fff;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px var(--accent-pink-glow);
        }

        .login-btn {
            background: var(--accent-pink);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--accent-pink-glow);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
            margin: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
        <div class="logo-section">
            <div class="logo-cherry">🍒</div>
            <h2>Vishnu's Console</h2>
            <p class="subtitle">Access secure device gateway</p>
        </div>

        <form id="login-form" class="form-group">
            <label for="password">Enter Access Key</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
            </div>
            <p id="error-txt" class="error-message"></p>
            <button type="submit" class="login-btn">Authenticate</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("login-form");
        const passwordInput = document.getElementById("password");
        const errorTxt = document.getElementById("error-txt");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorTxt.style.display = "none";
            const password = passwordInput.value;

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();
                if (response.ok && data.status === "success") {
                    window.location.href = "/dashboard";
                } else {
                    errorTxt.textContent = data.message || "Invalid Access Key";
                    errorTxt.style.display = "block";
                    passwordInput.focus();
                }
            } catch (err) {
                errorTxt.textContent = "Server connection lost. Please try again.";
                errorTxt.style.display = "block";
            }
        });
    </script>
</body>
</html>
